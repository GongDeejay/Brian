name: Deploy to brian.mplusm.site

# 推送到 main 即自动构建两个平台并发布；
# 也可以在 Actions 页面手动触发（workflow_dispatch）。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只允许一个发布任务，避免并发 rsync 互相覆盖。
concurrency:
  group: deploy-brian-site
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            wm/package-lock.json
            neuro/package-lock.json

      - name: Build 工作记忆训练与评估平台
        working-directory: wm
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Build NeuroClassify 分类与模式识别平台
        working-directory: neuro
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Assemble the site
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site/wm site/neuro
          cp index.html site/index.html
          cp -R wm/dist/. site/wm/
          cp -R neuro/dist/. site/neuro/
          # 保留一份构建溯源信息，方便确认线上跑的是哪个提交。
          cat > site/BUILD_INFO.json <<EOF
          {
            "commit": "${GITHUB_SHA}",
            "ref": "${GITHUB_REF_NAME}",
            "run": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          echo "--- assembled site ---"
          find site -maxdepth 2 -type f | sort | head -50

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy with rsync
        run: |
          set -euo pipefail
          rsync -az --delete --mkpath \
            --no-perms --omit-dir-times \
            --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r \
            -e "ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o IdentitiesOnly=yes" \
            site/ "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/brian.mplusm.site/"

      # 发布后自检。
      # 网络层未就绪（DNS 未解析 / 443 证书还没签发）时只警告，
      # 因为那属于首次搭建的正常中间状态；
      # 一旦能收到 HTTP 响应，任何非 200 都判定发布失败，避免坏版本静默上线。
      - name: Verify the live site
        run: |
          set -uo pipefail
          host="brian.mplusm.site"
          base="https://${host}"

          failed=0
          not_ready=0

          for path in / /wm/ /neuro/; do
            url="${base}${path}"
            err=$(mktemp)
            # NOTE: the runner invokes bash with -e, so a bare failing command
            # substitution would abort the script before we can inspect the exit
            # code. `|| rc=$?` keeps the failure inside a || list so it is caught.
            rc=0
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url" 2>"$err") || rc=$?

            if [ "$rc" -ne 0 ]; then
              case "$rc" in
                6|7|35|60)
                  # 6=域名无法解析 7=连接被拒 35=TLS 握手失败 60=证书无效
                  echo "  ${path} -> 未就绪 (curl exit ${rc})"
                  not_ready=1
                  ;;
                *)
                  echo "  ${path} -> 请求失败 (curl exit ${rc}): $(head -1 "$err")"
                  failed=1
                  ;;
              esac
              rm -f "$err"
              continue
            fi

            rm -f "$err"
            echo "  ${path} -> ${code}"
            [ "$code" = "200" ] || failed=1
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::线上自检失败：站点已能响应，但至少一个路径未返回 200。请检查 nginx 配置与部署产物（见 deploy/SETUP.md）。"
            exit 1
          fi

          if [ "$not_ready" -ne 0 ]; then
            echo "::notice::产物已发布，但 ${host} 的网络层尚未就绪（DNS 未生效或 HTTPS 证书未签发）。完成 deploy/SETUP.md 第 1、4 步后，重新运行本工作流即可看到完整自检。"
            exit 0
          fi

          echo "✓ 线上自检通过"
