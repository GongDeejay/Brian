name: Deploy to brian.mplusm.site

# 推送到 main 即自动构建两个平台并发布；
# 也可以在 Actions 页面手动触发（workflow_dispatch）。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只允许一个发布任务，避免并发 rsync 互相覆盖。
concurrency:
  group: deploy-brian-site
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            wm/package-lock.json
            neuro/package-lock.json

      - name: Build 工作记忆训练与评估平台
        working-directory: wm
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Build NeuroClassify 分类与模式识别平台
        working-directory: neuro
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build

      - name: Assemble the site
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site/wm site/neuro
          cp index.html site/index.html
          cp -R wm/dist/. site/wm/
          cp -R neuro/dist/. site/neuro/
          # 保留一份构建溯源信息，方便确认线上跑的是哪个提交。
          cat > site/BUILD_INFO.json <<EOF
          {
            "commit": "${GITHUB_SHA}",
            "ref": "${GITHUB_REF_NAME}",
            "run": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          echo "--- assembled site ---"
          find site -maxdepth 2 -type f | sort | head -50

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy with rsync
        run: |
          set -euo pipefail
          rsync -az --delete --mkpath \
            --no-perms --omit-dir-times \
            --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r \
            -e "ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o IdentitiesOnly=yes" \
            site/ "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/brian.mplusm.site/"

      # 发布后自检。
      # DNS 尚未生效时只提示（首次搭建阶段属正常）；一旦域名能解析，
      # 任何非 200 都会让这次发布失败，避免坏版本静默上线。
      - name: Verify the live site
        run: |
          set -uo pipefail
          host="brian.mplusm.site"
          base="https://${host}"

          if ! getent hosts "$host" >/dev/null 2>&1; then
            echo "::notice::$host 尚未解析（DNS 未配置），跳过线上自检。"
            echo "部署已完成，域名生效后请重新运行本工作流或再次 push。"
            exit 0
          fi

          echo "自检 $base"
          failed=0
          for path in / /wm/ /neuro/; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "${base}${path}" || echo "000")
            echo "  ${path} -> ${code}"
            [ "$code" = "200" ] || failed=1
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::线上自检失败：至少一个路径未返回 200。请检查 nginx 配置与证书（见 deploy/SETUP.md）。"
            exit 1
          fi
          echo "✓ 线上自检通过"
