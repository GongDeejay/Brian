# =====================================================
# brian.mplusm.site — Brian 认知神经科学实验平台
#
# 静态站点：入口页 + /wm/ + /neuro/
#   root 下的内容由 GitHub Actions 通过 rsync 发布
#   （见仓库 .github/workflows/deploy.yml）
#
# 安装位置：/www/server/panel/vhost/nginx/brian.mplusm.site.conf
# 修改后执行：nginx -t && nginx -s reload
# =====================================================

server {
    listen 80;
    server_name brian.mplusm.site;

    # certbot webroot 校验用，必须在 301 之前匹配
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name brian.mplusm.site;

    ssl_certificate     /etc/letsencrypt/live/brian.mplusm.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brian.mplusm.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/brian.mplusm.site;
    index index.html;

    charset utf-8;
    access_log /www/wwwlogs/brian.access.log;
    error_log  /www/wwwlogs/brian.error.log;

    # 静态站不需要请求体
    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---- 构建产物：文件名带内容哈希，可以永久缓存 ----
    location ~* ^/(wm|neuro)/assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # ---- 其他静态资源（含 «下载源码» 的 zip）：中等缓存 ----
    location ~* ^/(wm|neuro)/.*\.(?:js|css|svg|png|jpe?g|gif|webp|ico|woff2?|zip)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    # ---- 三个入口 HTML 一律不缓存，避免用户拿到旧壳 ----
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location = /wm/ {
        try_files /wm/index.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location = /wm/index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location = /neuro/ {
        try_files /neuro/index.html =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location = /neuro/index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ---- 兜底 ----
    location / {
        try_files $uri $uri/ =404;
    }

    # 目录列表关闭（默认即关闭，显式声明以防被面板改写）
    autoindex off;
}
